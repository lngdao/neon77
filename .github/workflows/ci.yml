name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [18, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Status line and installer tests
        run: node --test test/statusline.test.mjs test/install.test.mjs
      - name: Status line smoke run
        shell: bash
        run: echo '{"model":{"display_name":"ci"},"context_window":{"used_percentage":42}}' | node statusline.mjs
